# Builds the site and publishes dist/ to GitHub Pages.
#
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
# NOT IN USE: the live site is on Vercel (see vercel.json), which rebuilds on every push to main.
# This workflow is kept as a manual alternative: Actions tab > "Deploy site" > "Run workflow".
#
# When the real domain is ready: set SITE_URL to it (for example https://www.example.in) and
# SITE_BASE to "/" below, and add the domain in Settings > Pages > Custom domain.

name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and check
        env:
          SITE_URL: https://yj1302.github.io/devaexim
          SITE_BASE: /devaexim/
        run: |
          node _src/build.mjs
          node _src/check.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
