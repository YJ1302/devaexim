<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <title>Triphala powder</title>
  <defs>
    <radialGradient id="surface" cx="30%" cy="22%" r="95%">
      <stop offset="0" stop-color="#e8e2d6"/><stop offset="1" stop-color="#ccc0a9"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc96"/><stop offset=".38" stop-color="#cf9a41"/>
      <stop offset=".72" stop-color="#94621f"/><stop offset="1" stop-color="#5c3a10"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3910"/><stop offset=".45" stop-color="#9a6a26"/>
      <stop offset=".8" stop-color="#e2b764"/><stop offset="1" stop-color="#f3d28a"/>
    </linearGradient>
    <radialGradient id="mound" cx="42%" cy="38%" r="72%">
      <stop offset="0" stop-color="#bca17e" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#b09167" stop-opacity=".2"/>
      <stop offset=".66" stop-color="#A9875A" stop-opacity="0"/>
      <stop offset="1" stop-color="#5d4a32" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="contact" cx="50%" cy="50%" r="50%">
      <stop offset=".84" stop-color="#2a1a05" stop-opacity="0"/><stop offset="1" stop-color="#2a1a05" stop-opacity=".42"/>
    </radialGradient>
    <linearGradient id="leafSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="fruitSheen" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".3"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="502" result="t"/>
    <feColorMatrix in="t" type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 1" result="g"/>
    <feComponentTransfer in="g" result="k">
      <feFuncR type="linear" slope="1.6" intercept="0.2"/>
      <feFuncG type="linear" slope="1.6" intercept="0.2"/>
      <feFuncB type="linear" slope="1.6" intercept="0.2"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="k" mode="multiply" result="m"/>
    <feComposite in="m" in2="SourceGraphic" operator="in"/>
  </filter>
    <filter id="paper" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="509" result="t"/>
    <feColorMatrix in="t" type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 1" result="g"/>
    <feComponentTransfer in="g" result="k">
      <feFuncR type="linear" slope="0.5" intercept="0.8"/>
      <feFuncG type="linear" slope="0.5" intercept="0.8"/>
      <feFuncB type="linear" slope="0.5" intercept="0.8"/>
    </feComponentTransfer>
    <feBlend in="SourceGraphic" in2="k" mode="multiply" result="m"/>
    <feComposite in="m" in2="SourceGraphic" operator="in"/>
  </filter>
    <filter id="spill" x="-40%" y="-80%" width="180%" height="260%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="505" result="w"/>
      <feDisplacementMap in="SourceGraphic" in2="w" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="3" seed="502" result="t"/>
      <feColorMatrix in="t" type="matrix" values=".33 .33 .33 0 0 .33 .33 .33 0 0 .33 .33 .33 0 0 0 0 0 0 1" result="g"/>
      <feComponentTransfer in="g" result="k">
        <feFuncR type="linear" slope="1.6" intercept=".2"/><feFuncG type="linear" slope="1.6" intercept=".2"/><feFuncB type="linear" slope="1.6" intercept=".2"/>
      </feComponentTransfer>
      <feBlend in="d" in2="k" mode="multiply" result="m"/>
      <feComposite in="m" in2="d" operator="in"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="8" dy="12" stdDeviation="8" flood-color="#2a1a05" flood-opacity=".3"/></filter>
    <filter id="leafDrop" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#14200a" flood-opacity=".45"/></filter>
  </defs>

  <rect width="800" height="1000" fill="url(#surface)" filter="url(#paper)"/>

  <ellipse cx="430" cy="536" rx="278" ry="272" fill="#3b2508" opacity=".38" filter="url(#soft)"/>
  <circle cx="400" cy="500" r="272" fill="url(#rim)"/>
  <circle cx="400" cy="500" r="263" fill="none" stroke="#fff4cf" stroke-opacity=".45" stroke-width="2"/>
  <circle cx="400" cy="500" r="258" fill="url(#wall)"/>
  <circle cx="400" cy="500" r="232" fill="#A9875A" filter="url(#grain)"/>
    <circle cx="400" cy="500" r="232" fill="url(#mound)"/>
    <circle cx="400" cy="500" r="232" fill="url(#contact)"/>

  <g filter="url(#spill)">
      <ellipse cx="250" cy="896" rx="118" ry="42" fill="#A9875A"/>
      <ellipse cx="352" cy="930" rx="46" ry="17" fill="#A9875A"/>
    </g>
    <circle cx="331.5" cy="877.1" r="3.9" fill="#A9875A" opacity="0.7"/><circle cx="130.6" cy="877.3" r="3.5" fill="#95774f" opacity="0.8"/><circle cx="365.1" cy="935.9" r="1.9" fill="#95774f" opacity="0.9"/><circle cx="190.6" cy="937" r="1.8" fill="#95774f" opacity="0.9"/><circle cx="295.5" cy="900.4" r="2.6" fill="#95774f" opacity="0.9"/><circle cx="378.8" cy="921" r="2.3" fill="#95774f" opacity="0.9"/><circle cx="140.4" cy="859.6" r="3.6" fill="#A9875A" opacity="0.7"/><circle cx="195" cy="960.7" r="2.7" fill="#95774f" opacity="1"/><circle cx="390.5" cy="966.7" r="2.1" fill="#95774f" opacity="0.9"/><circle cx="153.1" cy="855.3" r="2.2" fill="#A9875A" opacity="0.8"/><circle cx="380" cy="910.8" r="2.8" fill="#A9875A" opacity="0.6"/><circle cx="179.2" cy="869.9" r="1.3" fill="#95774f" opacity="0.7"/><circle cx="274.5" cy="899.2" r="2.9" fill="#A9875A" opacity="0.9"/><circle cx="286.8" cy="907.9" r="3.2" fill="#A9875A" opacity="1"/><circle cx="165.3" cy="922.2" r="1.7" fill="#95774f" opacity="0.7"/><circle cx="342.2" cy="968.8" r="1.7" fill="#95774f" opacity="0.9"/><circle cx="285.5" cy="840.3" r="3.4" fill="#A9875A" opacity="0.7"/><circle cx="116.2" cy="885.3" r="3.6" fill="#A9875A" opacity="0.8"/><circle cx="289.6" cy="961.7" r="1.4" fill="#95774f" opacity="0.9"/><circle cx="336.4" cy="879.5" r="1.4" fill="#A9875A" opacity="0.7"/><circle cx="394.2" cy="837.7" r="4.2" fill="#95774f" opacity="0.7"/><circle cx="201.9" cy="935" r="1.7" fill="#95774f" opacity="0.9"/><circle cx="264" cy="903.4" r="3.7" fill="#A9875A" opacity="0.6"/><circle cx="378.8" cy="887.3" r="1.3" fill="#A9875A" opacity="0.6"/><circle cx="174.7" cy="883" r="3.7" fill="#95774f" opacity="0.8"/><circle cx="227.7" cy="851.7" r="4.3" fill="#95774f" opacity="0.6"/><circle cx="356.4" cy="960.1" r="4.3" fill="#A9875A" opacity="0.8"/><circle cx="306.6" cy="921.3" r="3.6" fill="#95774f" opacity="0.6"/><circle cx="437.7" cy="840.5" r="2.8" fill="#95774f" opacity="0.9"/><circle cx="226.8" cy="848.1" r="3" fill="#95774f" opacity="0.8"/><circle cx="260.6" cy="853.1" r="4" fill="#95774f" opacity="0.8"/><circle cx="392.8" cy="877" r="2.7" fill="#A9875A" opacity="0.7"/><circle cx="295.8" cy="836.1" r="3.2" fill="#A9875A" opacity="0.8"/><circle cx="325.8" cy="940.4" r="2.9" fill="#95774f" opacity="0.9"/><circle cx="347.1" cy="899.7" r="1.3" fill="#A9875A" opacity="1"/><circle cx="245" cy="878.8" r="3.4" fill="#A9875A" opacity="0.6"/><circle cx="274.9" cy="846.1" r="2.8" fill="#A9875A" opacity="0.8"/><circle cx="366.7" cy="873.4" r="2.6" fill="#A9875A" opacity="0.7"/><circle cx="241.5" cy="918.3" r="2" fill="#95774f" opacity="0.6"/><circle cx="256.9" cy="878.6" r="2.7" fill="#95774f" opacity="0.8"/><circle cx="269.8" cy="845.3" r="1.9" fill="#A9875A" opacity="0.6"/><circle cx="351.8" cy="884.4" r="3.8" fill="#95774f" opacity="0.9"/><circle cx="277.5" cy="930.7" r="3" fill="#A9875A" opacity="0.9"/><circle cx="345.8" cy="871.3" r="3.2" fill="#95774f" opacity="0.9"/><circle cx="253.1" cy="956.6" r="2.1" fill="#A9875A" opacity="0.9"/><circle cx="412.7" cy="943.7" r="4.3" fill="#95774f" opacity="0.6"/>
  <g transform="translate(600 205) scale(1.08)" filter="url(#drop)">
    <g transform="translate(-60 -40) rotate(-20)">
      <ellipse rx="58" ry="40" fill="#9a7440"/>
      <path d="M-32 -36 q-8 36 0 72" stroke="#6e5129" stroke-width="2.4" fill="none" opacity=".55"/><path d="M-11 -36 q-8 36 0 72" stroke="#6e5129" stroke-width="2.4" fill="none" opacity=".55"/><path d="M11 -36 q8 36 0 72" stroke="#6e5129" stroke-width="2.4" fill="none" opacity=".55"/><path d="M32 -36 q8 36 0 72" stroke="#6e5129" stroke-width="2.4" fill="none" opacity=".55"/>
      <ellipse rx="58" ry="40" fill="url(#fruitSheen)"/>
    </g>
    <g transform="translate(80 40)">
      <circle r="46" fill="#7b5a3a"/>
      <path d="M-20 -26 q20 -10 40 0" stroke="#a5825c" stroke-width="2.4" fill="none" opacity=".6"/>
      <circle r="46" fill="url(#fruitSheen)"/>
    </g>
    <g transform="translate(-80 90) rotate(30)">
      <path d="M0 -40 C32 -40 46 -8 40 14 C34 36 8 42 0 42 C-8 42 -34 36 -40 14 C-46 -8 -32 -40 0 -40Z" fill="#4f3b27"/>
      <path d="M0 -40 L0 42 M-30 -20 Q0 2 30 -20" stroke="#2f2216" stroke-width="2.4" fill="none" opacity=".55"/>
      <path d="M0 -40 C32 -40 46 -8 40 14" fill="none" stroke="#7a5e40" stroke-width="3" opacity=".7"/>
    </g></g>
</svg>
