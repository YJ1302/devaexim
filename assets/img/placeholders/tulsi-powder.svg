#72803F" opacity="0.6"/><circle cx="310.6" cy="846.7" r="2.6" fill="#647137" opacity="0.8"/><circle cx="285.8" cy="942.4" r="2.4" fill="#72803F" opacity="0.9"/><circle cx="241.5" cy="902.9" r="1.5" fill="#72803F" opacity="0.6"/><circle cx="403.4" cy="879.2" r="3.9" fill="#647137" opacity="0.8"/><circle cx="293.2" cy="960.6" r="1.4" fill="#647137" opacity="0.7"/><circle cx="344.5" cy="968.8" r="3.6" fill="#72803F" opacity="1"/><circle cx="428.7" cy="936" r="2.7" fill="#647137" opacity="0.7"/><circle cx="240.7" cy="832.7" r="2.9" fill="#72803F" opacity="0.8"/><circle cx="298.4" cy="920.1" r="3.1" fill="#72803F" opacity="0.6"/><circle cx="318.4" cy="928.6" r="3.9" fill="#647137" opacity="0.9"/><circle cx="360.1" cy="865.9" r="3.9" fill="#647137" opacity="1"/><circle cx="173.3" cy="922.9" r="3.1" fill="#72803F" opacity="0.6"/><circle cx="214.4" cy="861.9" r="2.4" fill="#72803F" opacity="0.8"/><circle cx="144.6" cy="883.5" r="1.3" fill="#647137" opacity="0.7"/><circle cx="310.8" cy="940" r="2.2" fill="#72803F" opacity="0.6"/><circle cx="414.1" cy="930.1" r="2.9" fill="#647137" opacity="1"/>
